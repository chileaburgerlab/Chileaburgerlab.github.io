<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CHILEA BURGER LAB — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#0c0c0e; --surface:#151518; --surface2:#1d1d22; --line:#2a2a31;
  --gold:#f7b500; --gold-soft:#ffd34d; --pink:#ff2e63;
  --text:#f5f5f5; --muted:#a9a9b0; --ok:#37d67a; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;}
.wrap{max-width:720px; margin:0 auto; padding:0 16px 80px;}
header.top{border-bottom:1px solid var(--line); padding:14px 16px;
  display:flex; align-items:center; gap:12px;}
header.top img{height:40px; width:auto;}
header.top .t{font-weight:800; letter-spacing:.06em; font-size:15px;}
header.top .t small{display:block; font-weight:500; color:var(--muted); font-size:11px; letter-spacing:.14em;}
h1{font-size:clamp(24px,5vw,32px); margin:26px 0 6px;}
.sub{color:var(--muted); margin:0 0 20px; font-size:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;}
.card h2{margin:0 0 6px; font-size:17px;}
.card p{color:var(--muted); font-size:13.5px; margin:0 0 10px;}
.btn{display:inline-block; border:none; cursor:pointer; border-radius:12px;
  padding:12px 20px; font-size:15px; font-weight:800; font-family:inherit;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#181200;
  text-decoration:none; text-align:center;}
.btn:disabled{opacity:.5;}
.btn-danger{background:transparent; border:1.5px solid var(--pink); color:var(--pink);
  padding:8px 14px; font-size:13px; border-radius:10px; cursor:pointer; font-family:inherit;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--muted);
  padding:10px 16px; font-size:13px; border-radius:10px; cursor:pointer; font-family:inherit;}
input,select{width:100%; background:var(--surface2);
  border:1.5px solid var(--line); border-radius:10px; color:var(--text);
  padding:12px; font-size:15px; font-family:inherit; margin-bottom:10px;}
input:focus,select:focus{outline:none; border-color:var(--gold);}
input[type=file]{padding:10px;}
.err{color:var(--pink); font-size:13px; min-height:20px; margin:6px 0;}
.okmsg{color:var(--ok); font-size:13px; min-height:20px; margin:6px 0;}
.hidden{display:none !important;}
.tabs{display:flex; gap:8px; margin:18px 0;}
.tab{flex:1; padding:13px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--muted); font-weight:800; font-size:14px;
  letter-spacing:.08em; cursor:pointer; font-family:inherit;}
.tab.active{border-color:var(--gold); color:var(--gold-soft); background:var(--surface2);}
.daybar{display:flex; gap:10px; align-items:center; margin-bottom:12px;}
.daybar input{margin:0;}
.summary{display:flex; gap:10px; margin-bottom:14px;}
.sum{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:12px;
  padding:12px; text-align:center;}
.sum .v{font-size:22px; font-weight:800; color:var(--gold-soft);}
.sum .l{font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase;}
.order{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:10px;}
.order .oh{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.order .on{font-weight:800; font-size:16px; color:var(--gold-soft);}
.order .ot{font-size:12px; color:var(--muted);}
.order .oc{font-size:14px; margin-bottom:6px;}
.order ul{margin:6px 0; padding-left:18px; font-size:13.5px; color:var(--muted);}
.order .ototal{display:flex; justify-content:space-between; align-items:center;
  border-top:1px dashed var(--line); margin-top:8px; padding-top:8px;}
.order .ototal b{font-size:17px;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
.fotos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
.foto-cell{position:relative; border-radius:10px; overflow:hidden; aspect-ratio:1;
  background:var(--surface2); border:1px solid var(--line);}
.foto-cell img{width:100%; height:100%; object-fit:cover; display:block;}
.foto-cell button{position:absolute; top:6px; right:6px; width:28px; height:28px;
  border-radius:50%; border:none; background:rgba(0,0,0,.65); color:#fff;
  font-size:15px; cursor:pointer; line-height:1;}
.foto-badge{position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.65);
  color:var(--gold-soft); font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:4px 8px; border-radius:99px;}
.prog{font-size:13px; color:var(--gold-soft); margin:8px 0;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin:18px 0 4px;}
.topbar h1{margin:0;}
.seg{display:flex; gap:8px; margin-bottom:10px;}
.seg label{flex:1; text-align:center; padding:11px; border-radius:10px; border:1.5px solid var(--line);
  color:var(--muted); font-size:13.5px; font-weight:700; cursor:pointer;}
.seg input{display:none;}
.seg input:checked + label{border-color:var(--gold); color:var(--gold-soft); background:var(--surface2);}
</style>
</head>
<body>
<header class="top">
  <img src="logo.png" alt="CHILEA BURGER LAB">
  <div class="t">CHILEA BURGER LAB<small>PANEL DEL NEGOCIO</small></div>
</header>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView">
    <h1>Entrar</h1>
    <p class="sub">Panel privado del negocio.</p>
    <div class="card">
      <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" style="width:100%;">Entrar</button>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panelView" class="hidden">
    <div class="topbar">
      <h1>Panel</h1>
      <button class="btn-ghost" id="logoutBtn">Salir</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabPedidos">PEDIDOS</button>
      <button class="tab" id="tabFotos">FOTOS</button>
    </div>

    <!-- PEDIDOS -->
    <div id="panePedidos">
      <div class="daybar">
        <input type="date" id="orderDate">
        <button class="btn" id="reloadOrders" style="white-space:nowrap;">Ver</button>
      </div>
      <div class="summary">
        <div class="sum"><div class="v" id="sumCount">–</div><div class="l">Pedidos</div></div>
        <div class="sum"><div class="v" id="sumTotal">–</div><div class="l">Total del día</div></div>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- FOTOS -->
    <div id="paneFotos" class="hidden">
      <div class="card">
        <h2>Subir foto</h2>
        <p>Se publica sola en la página. Sin tokens ni complicaciones.</p>
        <div class="seg">
          <input type="radio" name="seccion" id="secGal" value="galeria" checked><label for="secGal">Galería en movimiento</label>
          <input type="radio" name="seccion" id="secMenu" value="menu"><label for="secMenu">Menú</label>
        </div>
        <input type="text" id="fotoTitulo" placeholder="Título (opcional)">
        <input type="file" id="fotoFile" accept="image/*">
        <div class="prog" id="upProg"></div>
        <div class="err" id="upErr"></div>
        <div class="okmsg" id="upOk"></div>
        <button class="btn" id="upBtn" style="width:100%;">Subir foto</button>
      </div>
      <div class="card">
        <h2>Fotos publicadas</h2>
        <div class="fotos-grid" id="fotosGrid"></div>
      </div>
    </div>
  </div>

</div>

<script>
const API = "https://chilea-api.elvacilondelbsn.workers.dev";
const $ = id => document.getElementById(id);
const money = n => "$" + (parseFloat(n) || 0).toFixed(2);

function authHeaders(){
  const t = localStorage.getItem("chilea_admin_token") || "";
  return t ? {"Authorization": "Bearer " + t} : {};
}
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
  const r = await fetch(API + path, opts);
  if(r.status === 401){ logout(); throw new Error("Sesión vencida"); }
  return r.json();
}

/* ---------- login ---------- */
async function doLogin(){
  const u = $("loginUser").value.trim(), p = $("loginPass").value;
  $("loginErr").textContent = "";
  if(!u || !p){ $("loginErr").textContent = "Escribe usuario y contraseña."; return; }
  $("loginBtn").disabled = true;
  try{
    const r = await fetch(API + "/api/admin/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: u, pass: p})
    });
    const d = await r.json();
    if(d.ok && d.token){
      localStorage.setItem("chilea_admin_token", d.token);
      showPanel();
    }else{
      $("loginErr").textContent = "Usuario o contraseña incorrectos.";
    }
  }catch(e){ $("loginErr").textContent = "No se pudo conectar. Revisa tu internet."; }
  $("loginBtn").disabled = false;
}
function logout(){
  localStorage.removeItem("chilea_admin_token");
  $("panelView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginPass").value = "";
}
function showPanel(){
  $("loginView").classList.add("hidden");
  $("panelView").classList.remove("hidden");
  const d = new Date();
  $("orderDate").value = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  loadOrders();
  loadFotos();
}
$("loginBtn").addEventListener("click", doLogin);
$("loginPass").addEventListener("keydown", e=>{ if(e.key === "Enter") doLogin(); });
$("logoutBtn").addEventListener("click", logout);

/* ---------- pestañas ---------- */
function showTab(which){
  $("tabPedidos").classList.toggle("active", which === "pedidos");
  $("tabFotos").classList.toggle("active", which === "fotos");
  $("panePedidos").classList.toggle("hidden", which !== "pedidos");
  $("paneFotos").classList.toggle("hidden", which !== "fotos");
}
$("tabPedidos").addEventListener("click", ()=>showTab("pedidos"));
$("tabFotos").addEventListener("click", ()=>showTab("fotos"));

/* ---------- pedidos ---------- */
function fmtHora(iso){
  try{
    return new Date(iso).toLocaleTimeString("es-PR",{hour:"numeric",minute:"2-digit"});
  }catch(e){ return ""; }
}
async function loadOrders(){
  const date = $("orderDate").value;
  $("ordersList").innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const d = await api("/api/admin/orders?date=" + encodeURIComponent(date));
    $("sumCount").textContent = d.count;
    $("sumTotal").textContent = money(d.dayTotal);
    if(!d.orders.length){
      $("ordersList").innerHTML = '<div class="empty">No hay pedidos para este día.</div>';
      return;
    }
    $("ordersList").innerHTML = d.orders.map(o=>`
      <div class="order">
        <div class="oh"><span class="on">#${o.number}</span><span class="ot">${fmtHora(o.created_at)}</span></div>
        <div class="oc"><b>${escapeHtml(o.customer || "Sin nombre")}</b>${o.phone ? " · " + escapeHtml(o.phone) : ""}</div>
        <ul>${(o.items||[]).map(it=>`<li>${it.qty}× ${escapeHtml(it.title)} — ${money(it.total)}</li>`).join("")}</ul>
        <div class="ototal"><b>${money(o.total)}</b><button class="btn-danger" data-del="${o.id}">Borrar</button></div>
      </div>`).join("");
    $("ordersList").querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        if(!confirm("¿Borrar este pedido?")) return;
        await api("/api/admin/orders/" + b.dataset.del, {method: "DELETE"});
        loadOrders();
      });
    });
  }catch(e){
    $("ordersList").innerHTML = '<div class="empty">No se pudo cargar. Revisa tu internet.</div>';
  }
}
$("reloadOrders").addEventListener("click", loadOrders);
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- fotos ---------- */
function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 1200;
      let w = img.width, h = img.height;
      if(Math.max(w, h) > MAX){
        const k = MAX / Math.max(w, h);
        w = Math.round(w * k); h = Math.round(h * k);
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b=>b ? resolve(b) : reject(new Error("no blob")), "image/jpeg", 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$("upBtn").addEventListener("click", async ()=>{
  const f = $("fotoFile").files[0];
  $("upErr").textContent = ""; $("upOk").textContent = "";
  if(!f){ $("upErr").textContent = "Elige una foto primero."; return; }
  $("upBtn").disabled = true;
  try{
    $("upProg").textContent = "Optimizando…";
    const blob = await resizeImage(f);
    const seccion = document.querySelector('input[name="seccion"]:checked').value;
    const fd = new FormData();
    fd.append("photo", blob, "foto.jpg");
    fd.append("seccion", seccion);
    fd.append("titulo", $("fotoTitulo").value.trim());
    $("upProg").textContent = "Subiendo…";
    const r = await fetch(API + "/api/admin/photos", {
      method: "POST", headers: authHeaders(), body: fd
    });
    if(r.status === 401){ logout(); return; }
    const d = await r.json();
    if(d.ok){
      $("upOk").textContent = "Foto publicada.";
      $("fotoFile").value = ""; $("fotoTitulo").value = "";
      loadFotos();
    }else{
      $("upErr").textContent = d.error || "No se pudo subir.";
    }
  }catch(e){ $("upErr").textContent = "No se pudo conectar. Revisa tu internet."; }
  $("upProg").textContent = "";
  $("upBtn").disabled = false;
});
async function loadFotos(){
  try{
    const d = await api("/api/admin/photos");
    const list = d.photos || [];
    if(!list.length){
      $("fotosGrid").innerHTML = '<div class="empty" style="grid-column:1/-1;">Aún no hay fotos.</div>';
      return;
    }
    $("fotosGrid").innerHTML = list.map((p, i)=>`
      <div class="foto-cell">
        <img src="https://chileaburgerlab.github.io/${p.url}" alt="" loading="lazy">
        <span class="foto-badge">${p.seccion === "menu" ? "Menú" : "Galería"}</span>
        <button data-fdel="${i}" aria-label="Quitar">×</button>
      </div>`).join("");
    $("fotosGrid").querySelectorAll("[data-fdel]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        if(!confirm("¿Quitar esta foto de la página?")) return;
        await api("/api/admin/photos?index=" + b.dataset.fdel, {method: "DELETE"});
        loadFotos();
      });
    });
  }catch(e){ /* silencioso */ }
}

/* ---------- init ---------- */
if(localStorage.getItem("chilea_admin_token")){ showPanel(); }
</script>
</body>
</html>
